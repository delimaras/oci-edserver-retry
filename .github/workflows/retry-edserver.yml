name: OCI edserver Capacity Retry

on:
  # Χειροκίνητη εκτέλεση από το GitHub Actions.
  workflow_dispatch:

  # Αυτόματη εκτέλεση κάθε 5 λεπτά.
  schedule:
    - cron: '*/5 * * * *'

# Δεν επιτρέπουμε δύο executions του ίδιου workflow ταυτόχρονα.
concurrency:
  group: oci-edserver-capacity-retry
  cancel-in-progress: false

# Το workflow χρειάζεται μόνο read access στο repository.
permissions:
  contents: read

jobs:
  retry-edserver:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Εγκατάσταση OCI CLI
      # ============================================================
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      # ============================================================
      # 2. Ρύθμιση OCI CLI
      # ============================================================
      - name: Configure OCI CLI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          mkdir -p ~/.oci

          # Αποθήκευση του private API signing key.
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          # Δημιουργία OCI CLI configuration.
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

      # ============================================================
      # 3. Έλεγχος προηγούμενων Resource Manager APPLY jobs
      # ============================================================
      - name: Check previous Apply jobs
        id: check
        env:
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
        run: |
          echo "Checking previous Resource Manager jobs..."

          # --------------------------------------------------------
          # Έλεγχος 1:
          # Υπάρχει ήδη επιτυχημένο APPLY;
          #
          # Αν υπάρχει, θεωρούμε ότι το Terraform ολοκλήρωσε
          # επιτυχώς τη δημιουργία του instance και δεν πρέπει
          # να γίνει νέα προσπάθεια.
          # --------------------------------------------------------

          SUCCESS_COUNT=$(oci resource-manager job list \
            --stack-id "$OCI_STACK_ID" \
            --lifecycle-state SUCCEEDED \
            --all \
            --query 'length(data[?operation==`APPLY`])' \
            --raw-output)

          echo "Successful APPLY jobs: $SUCCESS_COUNT"

          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            echo "A successful APPLY already exists."
            echo "The instance should already have been created."
            echo "No new Apply job will be submitted."

            echo "should_apply=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # --------------------------------------------------------
          # Έλεγχος 2:
          # Υπάρχει APPLY σε κατάσταση ACCEPTED;
          #
          # Αυτό σημαίνει ότι η Oracle έχει δεχτεί το job αλλά
          # δεν έχει αρχίσει ακόμη η εκτέλεσή του.
          # --------------------------------------------------------

          ACCEPTED_COUNT=$(oci resource-manager job list \
            --stack-id "$OCI_STACK_ID" \
            --lifecycle-state ACCEPTED \
            --all \
            --query 'length(data[?operation==`APPLY`])' \
            --raw-output)

          # --------------------------------------------------------
          # Έλεγχος 3:
          # Υπάρχει APPLY που εκτελείται ήδη;
          # --------------------------------------------------------

          IN_PROGRESS_COUNT=$(oci resource-manager job list \
            --stack-id "$OCI_STACK_ID" \
            --lifecycle-state IN_PROGRESS \
            --all \
            --query 'length(data[?operation==`APPLY`])' \
            --raw-output)

          echo "Accepted APPLY jobs: $ACCEPTED_COUNT"
          echo "In-progress APPLY jobs: $IN_PROGRESS_COUNT"

          # --------------------------------------------------------
          # Αν υπάρχει ενεργό APPLY, δεν δημιουργούμε δεύτερο.
          # --------------------------------------------------------

          if [ "$ACCEPTED_COUNT" -gt 0 ] || [ "$IN_PROGRESS_COUNT" -gt 0 ]; then
            echo "An APPLY job is already active."
            echo "No new Apply job will be submitted."

            echo "should_apply=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # --------------------------------------------------------
          # Αν φτάσαμε εδώ:
          #
          # - δεν υπάρχει successful APPLY
          # - δεν υπάρχει accepted APPLY
          # - δεν υπάρχει APPLY σε εξέλιξη
          #
          # Άρα επιτρέπεται νέα προσπάθεια.
          # --------------------------------------------------------

          echo "No successful or active APPLY job found."
          echo "A new capacity attempt is allowed."

          echo "should_apply=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Νέα προσπάθεια δημιουργίας του instance
      # ============================================================
      - name: Start new Apply job
        if: steps.check.outputs.should_apply == 'true'
        env:
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
        run: |
          echo "Starting a new Resource Manager AUTO_APPROVED Apply..."

          # Μοναδικό όνομα για κάθε προσπάθεια.
          JOB_NAME="github-capacity-retry-$(date -u +%Y%m%dT%H%M%SZ)"

          # Δημιουργία νέου Resource Manager Apply job.
          oci resource-manager job create-apply-job \
            --stack-id "$OCI_STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED \
            --display-name "$JOB_NAME"

          echo "Apply job submitted successfully."
          echo "Job name: $JOB_NAME"

      # ============================================================
      # 5. Δεν χρειάζεται νέα προσπάθεια
      # ============================================================
      - name: No retry required
        if: steps.check.outputs.should_apply == 'false'
        run: |
          echo "No new Apply job was submitted."
          echo "Either an APPLY is already running or an APPLY has already succeeded."
