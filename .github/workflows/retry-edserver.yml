name: Test OCI Apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

      - name: Verify Resource Manager stack
        env:
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
        run: |
          echo "Verifying Resource Manager stack..."

          oci resource-manager stack get \
            --stack-id "$OCI_STACK_ID" \
            --query 'data.{name:"display-name",state:"lifecycle-state"}' \
            --output table

      - name: Start one Apply job
        env:
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
        run: |
          echo "Starting one AUTO_APPROVED Apply job..."

          oci resource-manager job create-apply-job \
            --stack-id "$OCI_STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED \
            --display-name "github-edserver-test-apply"
