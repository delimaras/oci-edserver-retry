name: OCI edserver Capacity Retry

on:
  # Χειροκίνητη εκτέλεση.
  workflow_dispatch:

  # Αυτόματη εκτέλεση κάθε 5 λεπτά.
  schedule:
    - cron: '2-59/5 * * * *'

# Αποτρέπει δύο GitHub runs του συγκεκριμένου workflow
# από το να εκτελούνται ταυτόχρονα.
concurrency:
  group: oci-edserver-capacity-retry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retry-edserver:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Εγκατάσταση OCI CLI
      # ============================================================
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      # ============================================================
      # 2. Ρύθμιση OCI CLI
      # ============================================================
      - name: Configure OCI CLI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          mkdir -p ~/.oci

          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

      # ============================================================
      # 3. Έλεγχος προηγούμενων Resource Manager jobs
      # ============================================================
      - name: Check previous Apply jobs
        id: check
        env:
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
        run: |
          echo "Checking previous Resource Manager jobs..."

          # --------------------------------------------------------
          # Παίρνουμε ΟΛΑ τα jobs του συγκεκριμένου stack μία φορά.
          # --------------------------------------------------------

          oci resource-manager job list \
            --stack-id "$OCI_STACK_ID" \
            --all \
            --output json \
            > jobs.json

          # --------------------------------------------------------
          # Με Python διαβάζουμε το JSON.
          #
          # Μετράμε αποκλειστικά jobs των οποίων:
          #
          # operation == APPLY
          #
          # και ελέγχουμε τα lifecycle states:
          #
          # SUCCEEDED
          # ACCEPTED
          # IN_PROGRESS
          # --------------------------------------------------------

          python <<'PY'
          import json
          import os

          with open("jobs.json", "r", encoding="utf-8") as f:
              response = json.load(f)

          jobs = response.get("data", [])

          apply_jobs = [
              job
              for job in jobs
              if job.get("operation") == "APPLY"
          ]

          successful = [
              job
              for job in apply_jobs
              if job.get("lifecycle-state") == "SUCCEEDED"
          ]

          accepted = [
              job
              for job in apply_jobs
              if job.get("lifecycle-state") == "ACCEPTED"
          ]

          in_progress = [
              job
              for job in apply_jobs
              if job.get("lifecycle-state") == "IN_PROGRESS"
          ]

          print(f"Total APPLY jobs: {len(apply_jobs)}")
          print(f"Successful APPLY jobs: {len(successful)}")
          print(f"Accepted APPLY jobs: {len(accepted)}")
          print(f"In-progress APPLY jobs: {len(in_progress)}")

          # --------------------------------------------------------
          # Απόφαση για το αν επιτρέπεται νέο APPLY.
          # --------------------------------------------------------

          if successful:
              print()
              print("A successful APPLY already exists.")
              print("No new Apply job will be submitted.")

              should_apply = "false"

          elif accepted or in_progress:
              print()
              print("An APPLY job is already active.")
              print("No new Apply job will be submitted.")

              should_apply = "false"

          else:
              print()
              print("No successful or active APPLY job found.")
              print("A new capacity attempt is allowed.")

              should_apply = "true"

          # --------------------------------------------------------
          # Στέλνουμε το αποτέλεσμα στο επόμενο GitHub Actions step.
          # --------------------------------------------------------

          github_output = os.environ["GITHUB_OUTPUT"]

          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"should_apply={should_apply}\n")
          PY

      # ============================================================
      # 4. Δημιουργία νέου Apply job μόνο όταν επιτρέπεται
      # ============================================================
      - name: Start new Apply job
        if: steps.check.outputs.should_apply == 'true'
        env:
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
        run: |
          echo "Starting a new Resource Manager AUTO_APPROVED Apply..."

          JOB_NAME="github-capacity-retry-$(date -u +%Y%m%dT%H%M%SZ)"

          oci resource-manager job create-apply-job \
            --stack-id "$OCI_STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED \
            --display-name "$JOB_NAME"

          echo
          echo "Apply job submitted successfully."
          echo "Job name: $JOB_NAME"

      # ============================================================
      # 5. Δεν απαιτείται νέα προσπάθεια
      # ============================================================
      - name: No retry required
        if: steps.check.outputs.should_apply == 'false'
        run: |
          echo "No new Apply job was submitted."
          echo "An APPLY is already active or one has already succeeded."
